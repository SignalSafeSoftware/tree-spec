name: TreeSpec Python

on:
    workflow_call:

concurrency:
    group: tree-spec-python-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

defaults:
    run:
        working-directory: python

jobs:
    checks:
        name: Checks (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  enable-cache: true

            - name: Install package and tooling
              run: |
                  uv venv --seed
                  uv export --extra dev --frozen --no-emit-project -o requirements-dev.txt
                  .venv/bin/python -m pip install --require-hashes --only-binary :all: --no-deps -r requirements-dev.txt
                  .venv/bin/python -m pip install --no-deps -e .

            - name: Ruff
              if: matrix.python-version == '3.12'
              run: .venv/bin/ruff check src tests scripts

            - name: Python strict types
              run: .venv/bin/mypy src/tree_spec

            - name: Combined coverage tooling regression tests
              if: matrix.python-version == '3.12'
              working-directory: .
              run: |
                  python/.venv/bin/ruff check --config python/pyproject.toml scripts/prepare_sonar_coverage.py tests
                  python/.venv/bin/mypy --strict --explicit-package-bases scripts/prepare_sonar_coverage.py tests/test_sonar_coverage.py
                  mkdir -p artifacts/tooling
                  python/.venv/bin/coverage run --rcfile=/dev/null --data-file=artifacts/tooling/.coverage --source=scripts,python/scripts -m unittest discover -s tests -v
                  PYTHONPATH=python/src python/.venv/bin/coverage run --rcfile=/dev/null --data-file=artifacts/tooling/.coverage --source=scripts,python/scripts --append python/scripts/export_authoring_schema.py typescript/src/authoringSchema.ts --check
                  python/.venv/bin/coverage xml --rcfile=/dev/null --data-file=artifacts/tooling/.coverage -o artifacts/tooling/coverage.xml
                  python/.venv/bin/python scripts/prepare_sonar_coverage.py record tooling

            - name: Upload tooling coverage
              if: matrix.python-version == '3.12'
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-tooling
                  path: |
                      artifacts/tooling/coverage.xml
                      artifacts/tooling/source-sha256.json

            - name: Bandit
              if: matrix.python-version == '3.12'
              run: .venv/bin/bandit -r src scripts -q

    tests:
        name: Tests (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  enable-cache: true

            - name: Install package and tooling
              run: |
                  uv venv --seed
                  uv export --extra dev --frozen --no-emit-project -o requirements-dev.txt
                  .venv/bin/python -m pip install --require-hashes --only-binary :all: --no-deps -r requirements-dev.txt
                  .venv/bin/python -m pip install --no-deps -e .

            - name: Pytest with coverage
              run: .venv/bin/python -m pytest -q --cov-report=xml

            - name: Bind coverage to authored source bytes
              if: matrix.python-version == '3.12'
              run: .venv/bin/python ../scripts/prepare_sonar_coverage.py record python

            - name: Upload coverage
              if: matrix.python-version == '3.12'
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-python
                  path: |
                      python/coverage.xml
                      python/source-sha256.json

    smoke-package:
        name: Smoke package
        needs: [checks, tests]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  enable-cache: true

            - name: Install package and tooling
              run: |
                  uv venv --seed
                  uv export --extra dev --frozen --no-emit-project -o requirements-dev.txt
                  .venv/bin/python -m pip install --require-hashes --only-binary :all: --no-deps -r requirements-dev.txt
                  .venv/bin/python -m pip install --no-deps -e .

            - name: Smoke-test wheel artifact
              run: .venv/bin/python scripts/smoke_package.py

    distributions:
        name: Cross-language contract and artifact boundaries
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: .
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
            - run: corepack enable && yarn install --frozen-lockfile --ignore-scripts && yarn typecheck && yarn test:coverage && yarn build
            - name: Locked binary dependencies and explicit source verification
              working-directory: python
              run: |
                  uv sync --frozen --extra dev --no-build --no-install-project
                  PYTHONPATH=src .venv/bin/python -m pytest
                  .venv/bin/python -m build
            - run: yarn check:distributions
