name: CI

on:
    push:
        branches: [main, develop]
        tags: ["ts-v*", "py-v*"]
    pull_request:
        branches: [main, develop]
        types: [opened, synchronize, reopened, labeled]
    workflow_dispatch:
        inputs:
            publish_npm:
                description: Publish npm after TypeScript checks pass (main only)
                type: boolean
                default: false
            publish_pypi:
                description: Publish PyPI after Python checks pass (main only)
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    typescript:
        name: TypeScript / npm
        permissions:
            contents: read
            pull-requests: write
        uses: ./.github/workflows/typescript.yml
        with:
            publish: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_npm && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ts-v')) }}
        secrets:
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
            PACKAGES_SONAR_TOKEN: ${{ secrets.PACKAGES_SONAR_TOKEN }}

    python:
        name: Python / PyPI
        permissions:
            contents: read
            pull-requests: write
        uses: ./.github/workflows/python.yml
        with:
            publish: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_pypi && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/py-v')) }}
        secrets:
            PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
            PACKAGES_SONAR_TOKEN: ${{ secrets.PACKAGES_SONAR_TOKEN }}

    dependency-review:
        name: Dependency review
        if: github.event_name == 'pull_request'
        permissions:
            contents: read
            pull-requests: read
        uses: ./.github/workflows/dependency-review.yml
