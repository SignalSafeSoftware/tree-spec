name: TreeSpec Typescript

on:
    workflow_call:

permissions:
    contents: read

jobs:
    checks:
        name: Checks (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["22", "24"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Enable Yarn
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile --ignore-scripts

            - name: Lint
              run: yarn lint

            - name: Typecheck
              run: yarn typecheck

            - name: Build
              run: yarn build

    tests:
        name: Tests (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["22", "24"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Enable Yarn
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile --ignore-scripts

            - name: Test with coverage
              run: yarn test:coverage

            - uses: actions/setup-python@v7
              if: matrix.node-version == '24'
              with:
                  python-version: "3.12"

            - name: Bind coverage to authored source bytes
              if: matrix.node-version == '24'
              run: python scripts/prepare_sonar_coverage.py record typescript

            - name: Upload coverage
              if: matrix.node-version == '24'
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-typescript
                  path: |
                      typescript/coverage/lcov.info
                      typescript/coverage/source-sha256.json

    smoke-package:
        name: Smoke package (Node ${{ matrix.node-version }})
        needs: [checks, tests]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["22", "24"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Enable Yarn
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile --ignore-scripts

            - name: Smoke-test packed artifact
              run: yarn smoke:package

    runtime-compatibility:
        name: Packed runtime (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["19.0.0", "19", "20", "21", "22", "23", "24"]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
            - name: Build package with development tooling
              run: |
                  corepack enable
                  yarn install --frozen-lockfile --ignore-scripts
                  yarn build
                  mkdir -p "$RUNNER_TEMP/tree-spec-package"
                  npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/tree-spec-package" --workspace @signalsafe/tree-spec
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Install and test as an external consumer
              run: |
                  mkdir -p "$RUNNER_TEMP/tree-spec-consumer"
                  cp typescript/tests/runtime-compatibility.mjs "$RUNNER_TEMP/tree-spec-consumer/"
                  cd "$RUNNER_TEMP/tree-spec-consumer"
                  npm init -y
                  npm install --engine-strict --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/tree-spec-package/*.tgz
                  node runtime-compatibility.mjs

    distributions:
        name: Both distribution contents and wire fixtures
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
            - run: corepack enable && yarn install --frozen-lockfile --ignore-scripts && yarn build
            - name: Locked binary dependencies and explicit source verification
              working-directory: python
              run: |
                  uv sync --frozen --extra dev --no-build --no-install-project
                  PYTHONPATH=src .venv/bin/python -m pytest
                  .venv/bin/python -m build
            - run: yarn check:distributions
            - name: Measure actual JavaScript distribution checker
              run: |
                  mkdir -p artifacts/tooling-js artifacts/tooling
                  node --test --experimental-test-coverage --test-reporter=lcov scripts/check-distributions.mjs > artifacts/tooling-js/lcov.info
                  python scripts/prepare_sonar_coverage.py record tooling
                  cp artifacts/tooling/source-sha256.json artifacts/tooling-js/source-sha256.json
            - uses: actions/upload-artifact@v7
              with:
                  name: coverage-tooling-js
                  path: artifacts/tooling-js/
